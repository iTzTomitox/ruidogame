<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RUIDO</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      /* Flecha pixel art desde el arranque (después el juego cambia a mano / click: src/systems/cursor.js). */
      html, body, #game canvas { cursor: url(cursor.png) 0 0, auto; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
